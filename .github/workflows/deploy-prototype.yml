name: Deploy redesign prototype

# The Pages deploy on `main` builds this branch into /prototype/, but a push here doesn't start it.
# Dispatch it so the prototype stays current with every push to `redesign`.
on:
  push:
    branches: [redesign]
    paths:
      - "web/**"
      - ".github/workflows/deploy-prototype.yml"

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the Pages deploy on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main --repo "${{ github.repository }}"
