name: Deploy Italian

# Builds the app and deploys it with its sync server, as the Cloudflare Worker at
# italian.guymichaely.com (worker/). Needs the repository secret CLOUDFLARE_API_TOKEN: a Cloudflare
# API token from the "Edit Cloudflare Workers" template.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "worker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: italian-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            worker/package-lock.json

      - name: Test and build the app
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Deploy the Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm ci
          npx wrangler deploy
