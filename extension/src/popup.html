<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Italian</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Italian</h1>
      <a id="open-app" target="_blank" rel="noreferrer">Open Italian</a>
    </header>
    <input id="search" type="search" placeholder="Look up an Italian or English word" autocomplete="off" spellcheck="false" autofocus />
    <section id="results" aria-live="polite"></section>
    <section id="added"></section>
    <footer>Dictionary from <a href="https://en.wiktionary.org/" target="_blank" rel="noreferrer">Wiktionary</a> (CC BY-SA). Select a word on any page and right-click to add it.</footer>
    <script src="popup.js"></script>
  </body>
</html>
